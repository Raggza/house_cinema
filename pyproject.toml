[project]
name = "house-cinema"
version = "0.1.0"
description = "LAN video hub: serve local video folders to phones and computers on the same network"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "segno>=1.6.6",
    "uvicorn>=0.29",
]

[dependency-groups]
desktop = [
    "pillow>=13.0.0",
    "pystray>=0.19.5",
]
dev = [
    "httpx>=0.27",
    "playwright>=1.44",
    "pytest>=8.0",
]
packaging = [
    "pyinstaller>=6.22.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
