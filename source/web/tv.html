<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Màn hình TV – House Cinema</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M12 9v14l11-7z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/tv.js"></script>
</head>
<body class="tv-page">
<section id="idle" class="tv-idle">
  <img id="qr" class="tv-qr" alt="Mã QR mở remote trên điện thoại" hidden>
  <div class="tv-text">
    <div class="tv-brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M12 9v14l11-7z"/></svg>
      <span>House Cinema</span>
    </div>
    <h1 id="headline" class="tv-title">Màn hình TV</h1>
    <p class="tv-line">Quét mã QR bằng camera điện thoại để điều khiển TV này, hoặc trên điện thoại mở trang
      <b>Điều khiển TV</b> của hub và chọn mã:</p>
    <p id="code" class="tv-code">····</p>
    <p id="url" class="tv-url"></p>
    <p id="status" class="tv-status" role="status">Đang kết nối tới hub…</p>
  </div>
</section>
<iframe id="frame" class="tv-frame" title="Trình phát" allow="autoplay; fullscreen" hidden></iframe>
<div id="badge" class="tv-badge" role="status" hidden></div>
<div id="start-box" class="tv-start">
  <button id="start" class="btn primary" type="button">Bắt đầu</button>
</div>
</body>
</html>
